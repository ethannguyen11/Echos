<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Echos</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/intro.css">
</head>
<body>

<div id="carte"></div>

<div id="barre-haut">
  <div id="fiche">Équipe vide</div>
  <button id="btn-grimoire">Grimoire</button>
</div>

<div id="hud">
  <div id="texte">Recherche de ta position...</div>
  <div id="etat"></div>
  <button id="entrer">Approcher</button>
</div>

<!-- ------------------ COMBAT ------------------ -->
<div id="combat">
  <div id="combat-lieu"></div>

  <div id="scene">
    <img id="monstre-img" alt="">
    <div id="monstre-vide">&#128128;</div>
  </div>

  <div class="jauge-bloc">
    <div class="jauge-nom">
      <span id="m-nom">Écho</span>
      <span id="m-pv">0/0</span>
    </div>
    <div class="jauge"><span id="m-jauge" style="width:100%"></span></div>
  </div>

  <div id="assimilation-bloc">
    <div class="jauge-nom">
      <span>Assimilation</span>
      <span id="a-val">0 %</span>
    </div>
    <div class="jauge"><span id="a-jauge" class="assimilation" style="width:0%"></span></div>
  </div>

  <div id="equipe-combat"></div>

  <div id="combat-message"></div>

  <div id="combat-actions">
    <button id="btn-attaquer">Attaquer</button>
    <button id="btn-assimiler" class="assimilation">Assimiler</button>
    <button id="btn-fuir">Fuir</button>
  </div>
</div>

<!-- ------------------ GRIMOIRE ------------------ -->
<div id="grimoire">
  <h2>GRIMOIRE</h2>
  <div class="aide">Touche un Écho pour le placer dans ton équipe (3 maximum).</div>
  <div id="liste-echos"></div>
  <button id="btn-fermer-grimoire">Fermer</button>
</div>

<div id="depart">
  <h1>ECHOS</h1>
  <p>Chaque lieu garde un savoir perdu. Tu ne combats pas : tu assimiles.</p>
  <button id="btn-depart">Commencer</button>
</div>

<!-- L'ordre de ces scripts compte : chacun se sert de ceux d'avant.
     jeu.js branche les boutons, il doit donc rester en dernier. -->
<script src="js/config.js"></script>
<script src="js/especes.js"></script>
<script src="js/lieux.js"></script>
<script src="js/carte.js"></script>
<script src="js/joueur.js"></script>
<script src="js/combat.js"></script>
<script src="js/grimoire.js"></script>
<script src="js/intro.js"></script>
<script src="js/jeu.js"></script>

</body>
</html>
