<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Echos</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/intro.css">
<link rel="stylesheet" href="css/ico.css">
</head>
<body>

<div id="carte"></div>

<div id="barre-haut">
  <div id="fiche">Équipe vide</div>
  <button id="btn-grimoire">Grimoire</button>
  <!-- La pastille signale qu'Ico s'est rappelé quelque chose.
       Cachee tant que js/ico.js ne lui pose pas la classe "visible". -->
  <button id="btn-ico">Ico<span id="ico-pastille"></span></button>
</div>

<!-- Le panneau du mode test. Invisible tant que js/modetest.js ne lui
     ajoute pas la classe "actif", ce qu'il ne fait que si MODE_TEST
     est a true dans js/config.js. -->
<div id="mode-test">
  <div class="mt-titre">Mode test</div>
  <label class="mt-ligne">Palier
    <input type="range" id="mt-palier" min="0" max="10" step="1" value="5">
    <span id="mt-palier-val">5</span>
  </label>
  <label class="mt-ligne">Niveau
    <input type="range" id="mt-niveau" min="1" max="50" step="1" value="5">
    <span id="mt-niveau-val">5</span>
  </label>
  <label class="mt-ligne">Espèce
    <select id="mt-espece"></select>
  </label>
</div>

<div id="hud">
  <div id="texte">Recherche de ta position...</div>
  <div id="etat"></div>
  <button id="entrer">Approcher</button>
</div>

<!-- ------------------ COMBAT ------------------ -->
<div id="combat">
  <div id="combat-lieu"></div>

  <!-- Le Figement du lieu : la seule jauge lisible d'un coup d'oeil,
       donc la premiere de l'ecran. -->
  <div id="figement-bloc">
    <div class="jauge-nom">
      <span id="f-libelle">Figement</span>
      <span id="f-val"></span>
    </div>
    <div class="jauge grosse"><span id="f-jauge" class="figement" style="width:0%"></span></div>
  </div>

  <div id="scene">
    <img id="monstre-img" alt="">
    <!-- Le visuel de secours. Vide ici : poserSecours() y met
         l'initiale de l'espece et ses couleurs d'affinite. -->
    <div id="monstre-vide"></div>
  </div>

  <div class="jauge-bloc">
    <div class="jauge-nom">
      <span><span id="m-nom">Écho</span><span id="m-fleche"></span></span>
      <span id="m-pv">0/0</span>
    </div>
    <!-- L'affinite de l'adversaire, sous son nom : le rapport de
         force se lit sans ouvrir le grimoire. Remplie par
         majAffichageCombat(). -->
    <div id="m-affinite"></div>
    <div class="jauge"><span id="m-jauge" style="width:100%"></span></div>
  </div>

  <div id="equipe-combat"></div>

  <div id="combat-message"></div>

  <!-- Les quatre commandes. Pleine largeur, empilees : le jeu se
       joue debout, dehors, au pouce. -->
  <div id="combat-actions">
    <button id="btn-attaquer">Attaquer</button>
    <button id="btn-aptitude">Aptitude</button>
    <button id="btn-assimiler" class="assimilation">Assimiler</button>
    <button id="btn-defendre">Défendre</button>
    <button id="btn-fuir" class="discret">Fuir</button>
  </div>

  <!-- Le menu d'aptitudes, ouvert par la commande Aptitude -->
  <div id="aptitudes">
    <div id="liste-aptitudes"></div>
    <button id="btn-fermer-aptitudes">Retour</button>
  </div>
</div>

<!-- ------------------ GRIMOIRE ------------------ -->
<div id="grimoire">
  <h2>GRIMOIRE</h2>
  <!-- Rempli par grimoire.js a chaque ouverture : "5 / 16 échos liés" -->
  <div id="grimoire-progression"></div>
  <div class="aide">Touche un Écho pour le placer dans ton équipe (3 maximum).</div>
  <div id="liste-echos"></div>
  <button id="btn-fermer-grimoire">Fermer</button>
</div>

<!-- L'intervention du didacticiel. Elle flotte par-dessus le jeu et
     ne recoit JAMAIS les touchers (pointer-events: none en CSS) :
     un appui la fait disparaitre tout en atteignant le bouton qui
     se trouve dessous. Elle ne bloque donc jamais l'action. -->
<div id="ico-bulle">
  <div class="ico-bulle-nom">ICO</div>
  <div id="ico-bulle-l1" class="ico-bulle-ligne"></div>
  <div id="ico-bulle-l2" class="ico-bulle-ligne"></div>
</div>

<!-- ------------------ ICO ------------------ -->
<div id="ico">
  <div id="ico-entete">
    <!-- La silhouette. data-defigement va de 0 a 5 : c'est lui
         qui pilote son apparence, entierement en CSS. -->
    <div id="ico-portrait" data-defigement="0">
      <svg viewBox="0 0 100 130" aria-hidden="true">
        <ellipse class="ico-tete" cx="50" cy="34" rx="20" ry="23"></ellipse>
        <path class="ico-corps-forme" d="M50 57 C22 57 14 82 14 130 L86 130 C86 82 78 57 50 57 Z"></path>
        <g class="ico-plaques">
          <rect x="30" y="18" width="40" height="9"></rect>
          <rect x="26" y="36" width="48" height="9"></rect>
          <rect x="22" y="66" width="56" height="10"></rect>
          <rect x="18" y="88" width="64" height="10"></rect>
          <rect x="16" y="110" width="68" height="10"></rect>
        </g>
        <g class="ico-cornes">
          <path d="M34 16 L28 2 L42 12 Z"></path>
          <path d="M66 16 L72 2 L58 12 Z"></path>
        </g>
        <circle class="ico-lueur" cx="50" cy="34" r="3"></circle>
      </svg>
    </div>
    <div>
      <h2>ICO</h2>
      <div class="aide">Ce que je sais du monde. Demande quand tu veux.</div>
    </div>
  </div>

  <!-- Les deux couches ne se melangent jamais. La reference est
       complete des le depart ; l'identite, en dessous, est la
       seule chose qui se debloque. -->
  <div id="ico-defilement">
    <div id="ico-sections"></div>
    <div id="ico-fragments"></div>
  </div>

  <button id="btn-fermer-ico">Fermer</button>
</div>

<div id="depart">
  <h1>ECHOS</h1>
  <p>Chaque lieu garde un savoir perdu. Tu ne combats pas : tu assimiles.</p>
  <button id="btn-depart">Commencer</button>
</div>

<!-- L'ordre de ces scripts compte : chacun se sert de ceux d'avant.
     jeu.js branche les boutons, il doit donc rester en dernier. -->
<script src="js/config.js"></script>
<script src="js/langues.js"></script>
<script src="js/especes.js"></script>
<script src="js/lieux.js"></script>
<script src="js/carte.js"></script>
<script src="js/joueur.js"></script>
<script src="js/combat.js"></script>
<script src="js/grimoire.js"></script>
<script src="js/intro.js"></script>
<script src="js/ico.js"></script>
<script src="js/modetest.js"></script>
<script src="js/jeu.js"></script>

</body>
</html>
