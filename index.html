<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Echos</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/intro.css">
</head>
<body>

<div id="carte"></div>

<div id="barre-haut">
  <div id="fiche">Équipe vide</div>
  <button id="btn-grimoire">Grimoire</button>
</div>

<!-- Le panneau du mode test. Invisible tant que js/modetest.js ne lui
     ajoute pas la classe "actif", ce qu'il ne fait que si MODE_TEST
     est a true dans js/config.js. -->
<div id="mode-test">
  <div class="mt-titre">Mode test</div>
  <label class="mt-ligne">Palier
    <input type="range" id="mt-palier" min="0" max="10" step="1" value="5">
    <span id="mt-palier-val">5</span>
  </label>
  <label class="mt-ligne">Niveau
    <input type="range" id="mt-niveau" min="1" max="50" step="1" value="5">
    <span id="mt-niveau-val">5</span>
  </label>
  <label class="mt-ligne">Espèce
    <select id="mt-espece"></select>
  </label>
</div>

<div id="hud">
  <div id="texte">Recherche de ta position...</div>
  <div id="etat"></div>
  <button id="entrer">Approcher</button>
</div>

<!-- ------------------ COMBAT ------------------ -->
<div id="combat">
  <div id="combat-lieu"></div>

  <!-- Le Figement du lieu : la seule jauge lisible d'un coup d'oeil,
       donc la premiere de l'ecran. -->
  <div id="figement-bloc">
    <div class="jauge-nom">
      <span id="f-libelle">Figement</span>
      <span id="f-val"></span>
    </div>
    <div class="jauge grosse"><span id="f-jauge" class="figement" style="width:0%"></span></div>
  </div>

  <div id="scene">
    <img id="monstre-img" alt="">
    <div id="monstre-vide">&#128128;</div>
  </div>

  <div class="jauge-bloc">
    <div class="jauge-nom">
      <span><span id="m-nom">Écho</span><span id="m-fleche"></span></span>
      <span id="m-pv">0/0</span>
    </div>
    <div class="jauge"><span id="m-jauge" style="width:100%"></span></div>
  </div>

  <div id="equipe-combat"></div>

  <div id="combat-message"></div>

  <!-- Les quatre commandes. Pleine largeur, empilees : le jeu se
       joue debout, dehors, au pouce. -->
  <div id="combat-actions">
    <button id="btn-attaquer">Attaquer</button>
    <button id="btn-aptitude">Aptitude</button>
    <button id="btn-assimiler" class="assimilation">Assimiler</button>
    <button id="btn-defendre">Défendre</button>
    <button id="btn-fuir" class="discret">Fuir</button>
  </div>

  <!-- Le menu d'aptitudes, ouvert par la commande Aptitude -->
  <div id="aptitudes">
    <div id="liste-aptitudes"></div>
    <button id="btn-fermer-aptitudes">Retour</button>
  </div>
</div>

<!-- ------------------ GRIMOIRE ------------------ -->
<div id="grimoire">
  <h2>GRIMOIRE</h2>
  <!-- Rempli par grimoire.js a chaque ouverture : "5 / 16 échos liés" -->
  <div id="grimoire-progression"></div>
  <div class="aide">Touche un Écho pour le placer dans ton équipe (3 maximum).</div>
  <div id="liste-echos"></div>
  <button id="btn-fermer-grimoire">Fermer</button>
</div>

<div id="depart">
  <h1>ECHOS</h1>
  <p>Chaque lieu garde un savoir perdu. Tu ne combats pas : tu assimiles.</p>
  <button id="btn-depart">Commencer</button>
</div>

<!-- L'ordre de ces scripts compte : chacun se sert de ceux d'avant.
     jeu.js branche les boutons, il doit donc rester en dernier. -->
<script src="js/config.js"></script>
<script src="js/especes.js"></script>
<script src="js/lieux.js"></script>
<script src="js/carte.js"></script>
<script src="js/joueur.js"></script>
<script src="js/combat.js"></script>
<script src="js/grimoire.js"></script>
<script src="js/intro.js"></script>
<script src="js/modetest.js"></script>
<script src="js/jeu.js"></script>

</body>
</html>
